name: Claude Model Summary
description: claude-code-action の実行ログから、解決されたモデル ID・コスト・ターン数・所要時間・拒否されたツールを Job Summary に出力する。
inputs:
  execution_file:
    description: 'claude-code-action の outputs.execution_file'
    required: true
  requested_model:
    description: '--model に渡した値（エイリアスまたはフル ID）'
    required: true
  save_metrics:
    description: 'true のとき、中身を含まないメトリクス JSON を artifact（claude-metrics-*）として30日保存する'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Report resolved model
      id: summary
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution_file }}
        REQUESTED_MODEL: ${{ inputs.requested_model }}
        # 公開 action なので、保存するかどうかは呼び出し側が決める（デフォルトは保存しない）
        METRICS_FILE: ${{ inputs.save_metrics == 'true' && format('{0}/claude-metrics.json', runner.temp) || '' }}
      run: |
        bash "${{ github.action_path }}/summarize.sh"
        if [ -n "$METRICS_FILE" ] && [ -f "$METRICS_FILE" ]; then
          # 1回の run で複数のジョブが呼んでも衝突しないよう、artifact 名に乱数を付ける
          echo "artifact_name=claude-metrics-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')" >> "$GITHUB_OUTPUT"
        fi

    # 中身（プロンプト・ツールの入力）を含まない小さな JSON だけを短期間保存する
    - name: Upload metrics
      if: steps.summary.outputs.artifact_name != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.summary.outputs.artifact_name }}
        path: ${{ runner.temp }}/claude-metrics.json
        retention-days: 30
        if-no-files-found: ignore
