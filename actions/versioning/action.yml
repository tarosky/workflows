name: Versioning
description: Change version string in readme, plugin file, or style.css, and verify it before release.
inputs:
  version:
    description: 'Version string. In many cases, github.ref. refs/tags/ and leading v are removed.'
    required: true
  files:
    description: 'Files to convert in CSV format. e.g. style.css, readme.txt'
    required: true
  prefix:
    description: 'Prefix to remove'
    required: false
    default: 'refs/tags/'
  wporg_slug:
    description: 'Plugin slug on WordPress.org. If set, the version must be greater than the published one.'
    required: false
    default: ''
outputs:
  version:
    description: 'Normalized version string. e.g. 1.2.3'
    value: ${{ steps.versioning.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Change and verify version
      id: versioning
      shell: bash
      env:
        VERSIONING_VERSION: ${{ inputs.version }}
        VERSIONING_FILES: ${{ inputs.files }}
        VERSIONING_PREFIX: ${{ inputs.prefix }}
        VERSIONING_WPORG_SLUG: ${{ inputs.wporg_slug }}
      run: bash "${{ github.action_path }}/versioning.sh"
