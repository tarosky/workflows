name: WP Compat Catalog Pages

# wp-compat/catalog の検証と GitHub Pages への公開。
# PR では検証とビルドのみ、main への push で公開する。

on:
  push:
    branches:
      - main
    paths:
      - 'wp-compat/**'
      - '.github/workflows/wp-compat-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'wp-compat/**'
      - '.github/workflows/wp-compat-pages.yml'
  workflow_dispatch:
    inputs:
      slack_test:
        description: Slack 通知の設定確認だけを行う（テストメッセージを送信。ビルド・デプロイはしない）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wp-compat-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slack-test:
    name: Slack test message
    if: github.event_name == 'workflow_dispatch' && inputs.slack_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: wp-compat/scripts

      - name: Send test message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::error::SLACK_WEBHOOK_URL が未設定です"
            exit 1
          fi
          php wp-compat/scripts/notify-slack.php --test

  build:
    name: Validate and build
    if: ${{ !inputs.slack_test }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-compat
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: composer test

      - name: Validate catalogs
        run: php scripts/validate.php

      - name: Build site
        run: php scripts/build-site.php --out=_site

      - name: Snapshot published catalog
        if: github.event_name != 'pull_request'
        run: |
          # デプロイ前に公開中のカタログを保存し、デプロイ後に差分を Slack に通知する.
          mkdir -p notify
          curl -sf https://tarosky.github.io/workflows/catalog.json -o notify/old.json || echo '{}' > notify/old.json
          cp _site/catalog.json notify/new.json

      - name: Upload catalogs for notification
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-catalogs
          path: wp-compat/notify

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: wp-compat/_site

  check:
    name: Self-test of wp-compat-check (dry run)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/wp-compat-check.yml
    permissions:
      contents: read
      issues: write
    with:
      from: '6.6'
      to: '7.1'
      path: wp-compat/tests/fixtures/plugin
      dry_run: true
      catalog_url: https://tarosky.github.io/workflows/catalog.json
      tool_ref: ${{ github.head_ref }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Notify Slack
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: wp-compat/scripts

      - uses: actions/download-artifact@v8
        with:
          name: wp-compat-catalogs
          path: catalogs

      - name: Notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: php wp-compat/scripts/notify-slack.php --old=catalogs/old.json --new=catalogs/new.json
