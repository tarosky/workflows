name: WP Compat Check

# WordPress本体の互換性カタログ（https://tarosky.github.io/workflows/）と
# 呼び出し元リポジトリのコードを照合し、影響があれば Issue を作成・更新する。
# 1リポジトリ×1リリースにつき1 Issue。再実行時は本文を更新し、チェック済みの項目は引き継ぐ。
# 閉じた Issue は新しい該当が出たときだけ再オープンし、古いリリースの Issue は新しい Issue に引き継いでクローズする。

on:
  workflow_call:
    inputs:
      to:
        description: 更新先の WordPress バージョン（例 7.2）。latest でカタログの最新（ベータ・trunk を含む）
        required: false
        type: string
        default: 'latest'
      from:
        description: 現在の WordPress バージョン（例 6.6）。空なら readme の Tested up to、それも無ければ更新先の直前のリリース
        required: false
        type: string
        default: ''
      path:
        description: 照合するディレクトリ（リポジトリルートからの相対パス）
        required: false
        type: string
        default: '.'
      exclude:
        description: 追加で除外するディレクトリ名（カンマ区切り）。vendor・node_modules・build・dist などは常に除外
        required: false
        type: string
        default: ''
      label:
        description: Issue に付けるラベル
        required: false
        type: string
        default: 'wp-compat'
      dry_run:
        description: true なら Issue を作成・更新せず、Job Summary にのみ出力する
        required: false
        type: boolean
        default: false
      catalog_url:
        description: カタログの URL
        required: false
        type: string
        default: 'https://tarosky.github.io/workflows/catalog.json'
      tool_ref:
        description: 照合スクリプトを取得する tarosky/workflows の ref
        required: false
        type: string
        default: 'main'

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check WordPress compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          path: target

      - name: Checkout wp-compat tool
        uses: actions/checkout@v6
        with:
          repository: tarosky/workflows
          ref: ${{ inputs.tool_ref }}
          path: wp-compat-tool
          sparse-checkout: wp-compat

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install tool dependencies
        working-directory: wp-compat-tool/wp-compat
        run: composer install --no-dev --no-interaction --no-progress

      - name: Run check
        env:
          TO: ${{ inputs.to }}
          FROM: ${{ inputs.from }}
          TARGET_PATH: ${{ inputs.path }}
          EXCLUDE: ${{ inputs.exclude }}
          CATALOG_URL: ${{ inputs.catalog_url }}
        run: |
          set +e
          php wp-compat-tool/wp-compat/scripts/check.php \
            --path="target/${TARGET_PATH}" \
            --to="${TO}" --from="${FROM}" \
            --exclude="${EXCLUDE}" \
            --catalog="${CATALOG_URL}" \
            --repo="${GITHUB_REPOSITORY}" --ref="${GITHUB_SHA}" \
            --json-out=result.json \
            > report.md 2> check.log
          code=$?
          set -e
          cat check.log
          if [ "${code}" -eq 1 ]; then
            exit 1
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update issue
        # パイプ（tee）の途中で失敗してもジョブを失敗させる.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.label }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          php wp-compat-tool/wp-compat/scripts/upsert-issue.php \
            --repo="${GITHUB_REPOSITORY}" --result=result.json --body=report.md \
            --label="${LABEL}" ${DRY_RUN} | tee -a "$GITHUB_STEP_SUMMARY"
