      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'editor_js:block-instance-custom-css-support'
    type: editor_js
    title: 全ブロックで customCSS サポートが既定有効になり、レンダリング時にクラスが注入される
    summary: |
      新しい `customCSS` ブロックサポートが全ブロックで既定有効になり、`style.css` 属性に CSS を保存し、フロントでは最外要素に `has-custom-css` と `wp-custom-css-{hash}` クラスが付与される（`edit_css` 権限のユーザーのみ編集可）。
      サーバーレンダリングのブロックは最初の HTML 要素に `WP_HTML_Tag_Processor` でクラスが注入されるため、最外要素が標準 HTML 要素でないブロックや生 HTML を出すブロックは `"supports": { "customCSS": false }` でオプトアウトすること。
    status: shipped
    severity: low
    confidence: manual
    symbols:
      - { kind: css_selector, name: .has-custom-css }
    source_urls:
