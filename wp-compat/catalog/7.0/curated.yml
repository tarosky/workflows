    summary: |
      `core/router` ストアの `state.navigation.hasStarted` / `hasFinished` は内部実装扱いとなり、7.0 からアクセスすると SCRIPT_DEBUG 時にコンソール警告が出る。将来のバージョンでは参照できなくなる。
      ナビゲーション状態の公式な取得手段は 7.1 で追加予定。クライアントナビゲーションの検知には `watch()` と `state.url` の組み合わせを使う。
