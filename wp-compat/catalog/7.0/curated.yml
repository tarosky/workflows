  - id: 'editor_js:interactivity-router-state-url-server-populated'
    type: editor_js
    title: core/router の state.url がサーバー側で初期化されるようになった
    summary: |
      これまでは `@wordpress/interactivity-router` の読み込み完了まで `state.url` が undefined で、その後 `window.location.href` がセットされていたが、7.0 ではディレクティブ処理時にサーバーで値が入り、最初のクライアントナビゲーションまで変化しない。
      初期の undefined → URL の変化を「ナビゲーション」として扱っていた、あるいはそれを除外するガードを書いていたストアは挙動を確認すること。
