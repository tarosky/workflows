  - id: 'editor_js:post-editor-iframe-inserted-blocks'
    type: editor_js
    title: 投稿エディタの iframe 判定が「登録済みブロック」から「挿入済みブロック」の apiVersion に変わった
    summary: |
      6.9 までは登録済みの全ブロックが apiVersion 3 以上のときだけ投稿エディタが iframe 化されたが、7.0 では投稿に実際に挿入されているブロックだけを判定する。
      apiVersion 2 以下のブロックを登録していても、その投稿で使っていなければエディタは iframe 化されるため、エディタ用 JS/CSS が `document` / `window` を直接参照するプラグインは iframe 内で動かなくなる可能性がある。ブロックを apiVersion 3 に上げ、iframe 前提でテストすること。
    status: shipped
    severity: medium
    confidence: manual
    match_hint: '[''"]?apiVersion[''"]?\s*[:=]>?\s*[12]\b'
    related: ['feature:enforced-iframe-editor']
    source_urls:
      - 'https://make.wordpress.org/core/2026/02/24/iframed-editor-changes-in-wordpress-7-0/'
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'editor_js:pattern-content-only-default'
    type: editor_js
    title: 非同期パターンとテンプレートパーツが既定で contentOnly 編集モードになった
    summary: |
      挿入された非同期（unsynced）パターンとテンプレートパーツは既定で `contentOnly` モードになり、内側ブロックの構造やスタイルは「パターンを編集」しない限り触れない。
      カスタムブロックは、編集可能にしたい属性に `"role": "content"`（またはサポート `contentRole: true`）がないと List View から隠れ選択不能になる。パターン内のブロックに依存するツールバー・サイドバーも表示されない可能性がある。
      無効化は `block_editor_settings_all` で `disableContentOnlyForUnsyncedPatterns` を true にする。テーマのパターン（特に Buttons/List/Social Icons/Navigation を含むもの）を確認すること。
    status: shipped
    severity: medium
    confidence: manual
    match_hint: 'register_block_pattern\s*\(|"role"\s*:\s*"content"'
    source_urls:
      - 'https://make.wordpress.org/core/2026/03/15/pattern-editing-in-wordpress-7-0/'
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'editor_js:block-visibility-metadata-object'
    type: editor_js
    title: blockVisibility メタデータが boolean だけでなくオブジェクト（viewport 指定）を取るようになった
    summary: |
      ブロックの `metadata.blockVisibility` は 6.9 の `false` に加え、7.0 では `{ "viewport": { "mobile": false, ... } }` 形式を取る。ビューポート単位の非表示は DOM には出力され CSS で隠される。
      サーバー側でブロックマークアップを生成・変換・解析するコードが blockVisibility をスカラー前提で扱っている場合、両方の型に対応させること。
    status: shipped
    severity: medium
