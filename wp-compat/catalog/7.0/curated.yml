changes:
  # ------------------------------------------------------------------
  # 出荷されなかった機能（dropped）
  # ------------------------------------------------------------------
  - id: 'feature:real-time-collaboration'
    type: feature
    title: リアルタイム共同編集（RTC）は 7.0 で出荷されなかった
    summary: |
      Yjs ベースのリアルタイム共同編集は Dev Note・Beta 告知（WP_ALLOW_COLLABORATION 定数、HTTP ポーリング）まで出たが、2026-05-08 に 7.0 から削除が決定され RC3 以降のビルドには含まれない。
      `sync.providers` JS フィルタや WP_ALLOW_COLLABORATION 定数を前提にしたコード、および「メタボックスがあると共同編集が無効になる」前提の対応は 7.0 では不要（7.0.0 のソースにも該当定数は存在しない）。
      メタボックスを `show_in_rest` 付き post meta へ移行する作業自体は将来の再導入に備えて有効。
    status: dropped
    severity: low
    confidence: manual
    match_hint: 'sync\.providers|WP_ALLOW_COLLABORATION'
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/08/rtc-removed-from-7-0/'
      - 'https://make.wordpress.org/core/2026/05/13/dev-chat-agenda-may-13-2026/'
      - 'https://make.wordpress.org/core/2026/03/10/real-time-collaboration-in-the-block-editor/'
      - 'https://make.wordpress.org/core/2026/04/01/building-a-custom-sync-provider-for-real-time-collaboration/'
      - 'https://make.wordpress.org/core/2026/03/31/extending-the-7-0-cycle/'

  - id: 'feature:client-side-media-processing'
    type: feature
    title: クライアントサイドのメディア処理は Beta 6 で差し戻され 7.0 に入らなかった
    summary: |
      ブラウザ側で画像最適化を行う Client-side Media Processing は Beta 1〜5 に含まれていたが、画像最適化とパッケージサイズの問題から Beta 6 で revert され、7.1 以降に持ち越された。
      7.0 のアップロードは従来どおりサーバー側（GD/Imagick）で処理されるため、画像サイズ生成フックに依存するプラグインへの影響はない。
    status: dropped
    severity: low
    confidence: manual
    source_urls:
      - 'https://make.wordpress.org/core/2026/03/20/wordpress-7-0-beta-6/'
      - 'https://make.wordpress.org/core/2026/05/28/wordcamp-asia-2026-core-committers-meeting/'
      - 'https://make.wordpress.org/core/2025/12/11/planning-for-7-0/'

  - id: 'feature:template-management'
    type: feature
    title: テンプレート管理（Template Organization/Management）の刷新は差し戻され 7.0 に入らなかった
    summary: |
      計画段階で挙がっていたテンプレート管理の改善（テーマ切り替えをまたいだテンプレートパーツの保持など）は、7.0 サイクル中に revert され 7.1 以降へ持ち越された。
      テンプレートパーツは引き続きアクティブテーマに紐づく（ナビゲーションオーバーレイも同様の既知の制約あり）。
    status: dropped
    severity: low
    confidence: manual
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/28/wordcamp-asia-2026-core-committers-meeting/'
      - 'https://make.wordpress.org/core/2025/12/11/planning-for-7-0/'

  - id: 'feature:react-19'
    type: feature
    title: React 19 へのアップグレードは 7.0 に入らなかった（React 18.3.1 のまま）
    summary: |
      7.0 の計画に React 19 への移行が挙がっていたが、7.0.0 の `react` / `react-dom` ハンドルは 18.3.1 のまま。
      React 19 はその後 Gutenberg 側でも一度 revert され、実験的機能扱いとなっている。7.0 対応のために React 19 前提の書き換えは不要。
    status: dropped
    severity: low
    confidence: manual
    source_urls:
      - 'https://make.wordpress.org/core/2025/12/11/planning-for-7-0/'
      - 'https://make.wordpress.org/core/2026/05/27/react-19-upgrade-in-wordpress/'

  - id: 'feature:enforced-iframe-editor'
    type: feature
    title: 投稿エディタの iframe 強制は 7.0 では見送られた
    summary: |
      計画では投稿エディタを無条件に iframe 化する予定だったが、7.0 では強制されない（Gutenberg プラグイン 22.6 以降ではクラシックテーマでも強制）。
      ただし iframe 化の判定条件は 7.0 で変わっているので `editor_js:post-editor-iframe-inserted-blocks` を参照。apiVersion 3 への移行は引き続き推奨。
    status: dropped
    severity: low
    confidence: manual
    related: ['editor_js:post-editor-iframe-inserted-blocks']
    source_urls:
      - 'https://make.wordpress.org/core/2026/02/24/iframed-editor-changes-in-wordpress-7-0/'
      - 'https://make.wordpress.org/core/2025/12/11/planning-for-7-0/'

  - id: 'feature:playlist-block'
    type: feature
    title: Playlist ブロックは 7.0 に入らなかった
    summary: |
      計画にあった Playlist ブロックは Field Guide から言及が削除され（5/17 の編集）、7.0.0 では `core/playlist` ブロックは登録されていない。
      7.0 で Playlist ブロックが使える前提の案内・パターンは作らないこと。
    status: dropped
    severity: low
    confidence: manual
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'
      - 'https://make.wordpress.org/core/2025/12/11/planning-for-7-0/'

  - id: 'feature:ai-client-rest-js-api'
    type: feature
    title: AI Client の REST エンドポイントと JavaScript API はコアに入らなかった
    summary: |
      マージ提案では REST エンドポイント＋JS API も対象だったが、7.0 のコアに入ったのは PHP API（`wp_ai_client_prompt()`）のみ。
      ブラウザから AI を呼ぶ場合は `wordpress/wp-ai-client` パッケージを使うか、機能ごとに専用の REST エンドポイントを自作する必要がある（後者が推奨）。
    status: dropped
    severity: low
    confidence: manual
    related: ['behavior:php-ai-client-bundled-in-core']
    source_urls:
      - 'https://make.wordpress.org/core/2026/02/03/proposal-for-merging-wp-ai-client-into-wordpress-7-0/'
      - 'https://make.wordpress.org/core/2026/03/24/introducing-the-ai-client-in-wordpress-7-0/'

  # ------------------------------------------------------------------
  # PHP 側の挙動変更
  # ------------------------------------------------------------------
  - id: 'behavior:php-ai-client-bundled-in-core'
    type: behavior
    title: PHP AI Client がコアに同梱され、プラグインの同梱版とクラスが衝突する
    summary: |
      7.0 は `wordpress/php-ai-client`（名前空間 `WordPress\AiClient`）とその依存をコアでロードするため、同じライブラリを Composer で同梱しているプラグインはクラス重複定義で衝突する。
      7.0 以上を必須にして依存を外し `AI_Client::prompt()` を `wp_ai_client_prompt()` に置き換えるか、7.0 未満のときだけ autoloader を読み込む条件分岐を入れること。
      `wordpress/wp-ai-client` パッケージは 7.0 を検知して自動で PHP 部分を無効化するが、最新版への更新が必要。
    status: shipped
    severity: high
    confidence: medium
    symbols:
      - { kind: method, name: 'AI_Client::prompt', replacement: wp_ai_client_prompt }
    match_hint: 'wordpress/(php|wp)-ai-client|WordPress\\AiClient\\'
    source_urls:
      - 'https://make.wordpress.org/core/2026/03/24/introducing-the-ai-client-in-wordpress-7-0/'
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'behavior:connectors-api-key-sources'
    type: behavior
    title: Connectors API が API キーを環境変数・定数・オプションから自動で読む
    summary: |
      Settings > Connectors 画面と Connectors API が追加され、AI プロバイダーの API キーを環境変数 → PHP 定数（`{PROVIDER_ID}_API_KEY`、例 `ANTHROPIC_API_KEY`）→ DB オプション（`connectors_ai_{id}_api_key`）の順に参照する。DB 保存のキーは暗号化されない。
      独自用途で同名の定数・環境変数を定義しているプラグインは、そのキーがコアの AI Client からも使われる点に注意。Akismet も組み込みコネクタとして `wordpress_api_key` / `WPCOM_API_KEY` が画面に表示される。
      コネクタのメタデータ変更は `wp_connectors_init` アクション内でのみ可能（unregister → register）。
    status: shipped
    severity: low
    confidence: medium
    symbols:
      - { kind: constant, name: ANTHROPIC_API_KEY }
      - { kind: option, name: connectors_ai_anthropic_api_key }
      - { kind: hook, name: wp_connectors_init }
    match_hint: '\b(ANTHROPIC|OPENAI|GOOGLE)_API_KEY\b'
    source_urls:
      - 'https://make.wordpress.org/core/2026/03/18/introducing-the-connectors-api-in-wordpress-7-0/'
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'behavior:block-hooks-moved-to-rest-controller'
    type: behavior
    title: Block Hooks の REST 処理が個別フィルタから REST コントローラへ移動した
    summary: |
      6.9 までは `rest_prepare_{post,page,wp_block,wp_navigation}` / `rest_pre_insert_*` に `insert_hooked_blocks_into_rest_response()` と `update_ignored_hooked_blocks_postmeta()` がフィルタとして登録されていたが、7.0 では `WP_REST_Posts_Controller` から直接呼ばれる。
      これらを `remove_filter()` して Block Hooks を止めていたコードは効かなくなる。対象投稿タイプの制御には新フィルタ `rest_block_hooks_post_types` を使う（コンテンツ系 CPT もここで追加できる）。
    status: shipped
    severity: medium
    confidence: medium
    symbols:
      - { kind: function, name: insert_hooked_blocks_into_rest_response }
      - { kind: function, name: update_ignored_hooked_blocks_postmeta }
      - { kind: hook, name: rest_block_hooks_post_types }
    match_hint: 'remove_filter\s*\(\s*[''"]rest_(prepare|pre_insert)_[a-z_]+[''"]\s*,\s*[''"](insert_hooked_blocks_into_rest_response|update_ignored_hooked_blocks_postmeta)'
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'behavior:default-role-dropdown-excludes-privileged-roles'
    type: behavior
    title: 新規ユーザーのデフォルト権限グループから管理者・編集者が選べなくなった
    summary: |
      設定 > 一般の「新規ユーザーのデフォルト権限グループ」から administrator と editor が除外され、既にどちらかが設定されている場合は Site Health が警告する。
      除外ロールは `default_role_dropdown_excluded_roles` フィルタで変更可能。会員サイト等で `default_role` を高権限に設定する運用・プラグインは確認が必要。
    status: shipped
    severity: low
    confidence: manual
    symbols:
      - { kind: option, name: default_role }
      - { kind: hook, name: default_role_dropdown_excluded_roles }
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'behavior:multisite-user-spam-no-longer-propagates-to-sites'
    type: behavior
    title: マルチサイトでユーザーをスパム指定してもサイトが自動でスパム扱いにならなくなった
    summary: |
      ネットワーク管理のユーザー一覧でユーザーをスパム指定（解除）した際、そのユーザーの所属サイトを `update_blog_status( ..., 'spam', ... )` で連動させる処理がデフォルトで無効になった。
      従来の挙動が必要なら `propagate_network_user_spam_to_blogs` フィルタで true を返す。またネットワーク管理者はスパム指定できなくなった（403）。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
      - { kind: hook, name: propagate_network_user_spam_to_blogs }
      - { kind: function, name: update_blog_status }
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'behavior:html5-script-style-theme-support-ignored'
    type: behavior
    title: html5 テーマサポートの script / style 指定が非推奨・無視され、常に HTML5 形式で出力される
    summary: |
      `add_theme_support( 'html5', array( 'script', 'style' ) )` の script/style 引数は 7.0 で非推奨かつ未使用になり、テーマのサポート有無にかかわらず `<script>` / `<style>` に `type` 属性や CDATA ラッパーが付かなくなった。
      出力 HTML の `type="text/javascript"` 等に依存するパーサ・テスト・正規表現置換は見直すこと。
    status: shipped
    severity: low
    confidence: medium
    match_hint: 'type=[''"]text/(javascript|css)[''"]|current_theme_supports\s*\(\s*[''"]html5[''"]\s*,\s*[''"](script|style)'
    related: ['deprecated:function:wp_sanitize_script_attributes']
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/14/wordpress-7-0-field-guide/'

  - id: 'behavior:author-link-title-attributes-removed'
    type: behavior
    title: 投稿者リンク系関数から title 属性が削除された
    summary: |
      `get_the_author_posts_link()` / `the_author_posts_link()` と `wp_list_authors()` の出力から「Posts by ○○」の title 属性がデフォルトで削除された。`get_the_author_link()` / `the_author_link()` は新引数 `$use_title_attr` で削除可能（デフォルトは従来どおり付与）。
      `the_author_posts_link` フィルタには第2・第3引数（表示名と旧 title テキスト）が追加された。title 属性をセレクタや JS で参照しているテーマ・テストは修正が必要。
    status: shipped
    severity: low
    confidence: medium
    symbols:
      - { kind: function, name: get_the_author_posts_link }
      - { kind: function, name: the_author_posts_link }
      - { kind: function, name: wp_list_authors }
      - { kind: function, name: get_the_author_link }
      - { kind: function, name: the_author_link }
      - { kind: hook, name: the_author_posts_link }
    source_urls:
      - 'https://make.wordpress.org/core/2026/05/14/removing-title-attributes-in-author-link-functions/'
      - 'https://make.wordpress.org/core/2026/05/23/accessibility-improvements-in-wordpress-7-0/'

  - id: 'behavior:image-alt-text-imported-from-iptc'
    type: behavior
    title: アップロード時に画像の IPTC メタデータから代替テキストが自動設定される
    summary: |
      新関数 `wp_get_image_alttext()` により `wp_read_image_metadata()` の結果に `alt` が加わり、アップロード時に IPTC の Alt Text が `_wp_attachment_image_alt` に保存されるようになった。
      代替テキストを自動生成・上書きするプラグイン（AI alt 生成など）は、既に値が入っているケースを考慮すること。
    status: shipped
    severity: low
    confidence: medium
