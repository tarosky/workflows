changes:
  -
    id: 'behavior:bcrypt-password-hashing'
    type: behavior
    title: 'ユーザーパスワードのハッシュが phpass から bcrypt（$wp$2y$）に変わった'
    summary: |
      wp_hash_password() / wp_check_password() が password_hash()/password_verify() ベースの bcrypt（SHA-384 プレハッシュ）になり、新しいハッシュは `$wp$2y$` プレフィックスで保存される。既存の `$P$` ハッシュは有効なままで、次回ログイン時に再ハッシュされる。
      `$P$` プレフィックスを前提にハッシュを直接検査・比較するコードや、wp_hash_password / wp_check_password を上書きしているプラグインは見直すこと。検証は必ず wp_check_password() を経由する。
    status: shipped
    severity: medium
    confidence: medium
    symbols:
      -
        kind: function
        name: wp_hash_password
      -
        kind: function
        name: wp_check_password
      -
        kind: function
        name: wp_password_needs_rehash
      -
        kind: hook
        name: password_needs_rehash
      -
        kind: hook
        name: wp_hash_password_algorithm
    match_hint: '\$P\$|user_pass|function\s+wp_(hash|check)_password\s*\('
    source_urls:
      - 'https://make.wordpress.org/core/2025/02/17/wordpress-6-8-will-use-bcrypt-for-password-hashing/'
      - 'https://make.wordpress.org/core/2025/03/28/wordpress-6-8-field-guide/'
  -
    id: 'behavior:fast-hash-security-keys'
    type: behavior
    title: 'アプリケーションパスワード・リセットキー等のハッシュが BLAKE2b（$generic$）に変わった'
    summary: |
      アプリケーションパスワード、パスワードリセットキー（user_activation_key）、個人データ要求キー、リカバリーモードキーが phpass から Sodium の BLAKE2b（`$generic$` プレフィックス）に移行した。既存ハッシュは期限内なら有効だが自動再ハッシュはされない。
      これらのハッシュを直接検証しているコードは新設の wp_verify_fast_hash() を使うよう改めること。
    status: shipped
    severity: medium
    confidence: medium
    symbols:
      -
        kind: function
        name: wp_fast_hash
      -
        kind: function
        name: wp_verify_fast_hash
      -
        kind: option
        name: recovery_keys
    match_hint: user_activation_key|_application_passwords|\$P\$
    related:
      - 'behavior:bcrypt-password-hashing'
    source_urls:
      - 'https://make.wordpress.org/core/2025/02/17/wordpress-6-8-will-use-bcrypt-for-password-hashing/'
  -
    id: 'php_requirement:hash-extension-required'
    type: php_requirement
    title: 'PHP の hash 拡張が必須要件になった'
    summary: |
      hash 拡張が $required_php_extensions に加わり、インストール・アップグレード時にチェックされるようになった。通常の PHP ビルドには含まれるため影響はまれだが、hash を無効化した特殊な環境ではアップグレードが止まる。
    status: shipped
    severity: low
    confidence: manual
    source_urls:
      - 'https://make.wordpress.org/core/2025/03/28/wordpress-6-8-field-guide/'
  -
    id: 'behavior:wp-query-normalized-query-vars'
    type: behavior
    title: 'WP_Query のクエリ変数が並べ替え・型変換されて保持されるようになった'
    summary: |
      キャッシュヒット率向上のため、WP_Query は配列引数（post_type 配列や author__not_in など）をソート・重複除去・型変換してから保持する。WP_Query::get() や $query_vars の値が渡した配列と一致しなくなる（例: ['post','page'] → ['page','post']、['2','1'] → [1,2]）。
      posts_where などのフィルター内で配列を === で比較しているコードは array_diff() 等の順序非依存の比較に改めること。
    status: shipped
    severity: medium
    confidence: medium
    symbols:
      -
        kind: method
        name: 'WP_Query::get'
      -
        kind: class
        name: WP_Query
    match_hint: '===\s*\$\w+->(get\s*\(|query_vars\[)|->(get\s*\([^)]*\)|query_vars\[[^\]]*\])\s*==='
    source_urls:
      - 'https://make.wordpress.org/core/2025/04/17/wp_query-changes-in-wordpress-6-8/'
      - 'https://make.wordpress.org/core/2025/04/16/wordpress-6-8-performance-improvements/'
  -
    id: 'behavior:count-user-posts-cached'
    type: behavior
    title: 'count_user_posts() の結果がオブジェクトキャッシュされるようになった'
    summary: |
      count_user_posts() の SQL 結果がキャッシュされるようになった（posts の last_changed で無効化）。投稿を直接 SQL で書き換えるなど、通常の API を経由しない更新をした直後に件数を取得するコードは古い値を得る可能性がある。
    status: shipped
