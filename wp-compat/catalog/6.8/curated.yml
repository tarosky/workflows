  -
    id: 'behavior:speculative-loading'
    type: behavior
    title: 'フロントエンドで Speculative Loading（リンク先の prefetch）がデフォルト有効になった'
    summary: |
      パーマリンク有効かつ未ログイン時、フロントのリンクがクリック開始時点で prefetch（conservative）される。クエリパラメータ付き URL は除外されるが、独自リライトで GET による状態変更（カート追加等）を行う「アクション URL」を持つプラグインは wp_speculation_rules_href_exclude_paths で除外すること。
      prerender を有効にするサイトでは分析タグ等のクライアント処理が先行実行されうる。no-prefetch / no-prerender クラスでブロック単位の除外も可能。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
      -
        kind: hook
        name: wp_speculation_rules_href_exclude_paths
      -
        kind: hook
        name: wp_speculation_rules_configuration
      -
        kind: hook
        name: wp_load_speculation_rules
      -
        kind: class
        name: WP_Speculation_Rules
    source_urls:
      - 'https://make.wordpress.org/core/2025/03/06/speculative-loading-in-6-8/'
      - 'https://make.wordpress.org/core/2025/03/28/wordpress-6-8-field-guide/'
  -
    id: 'behavior:block-assets-on-demand-filter-split'
    type: behavior
    title: 'ブロックアセットのオンデマンド読み込みが should_load_separate_core_block_assets から分離された'
    summary: |
      これまで should_load_separate_core_block_assets は「コアブロックCSSの個別読み込み」と「ページ内のブロックのアセットだけを読み込む」の2役を担っていたが、後者は新フィルター should_load_block_assets_on_demand（wp_should_load_block_assets_on_demand()）に分離された。後方互換で旧フィルターは両方に効き続ける。
      旧フィルターでオンデマンド読み込みを制御しているプラグイン・テーマは新フィルターへの移行を検討すること。ブロックテーマは両方ともデフォルト有効。
    status: shipped
    severity: low
    confidence: medium
    symbols:
