changes:
  -
    id: 'feature:enforced-iframe-editor'
    type: editor_js
    title: '投稿エディタが常に iframe 化された（ブロック API バージョン・メタボックスの有無に関係なく）'
    summary: |
      7.0 までは挿入されたブロックの API バージョンが 3 未満だと投稿エディタは非 iframe に戻っていたが、7.1 ではテーマ種別・ブロック API バージョン・レガシーメタボックスの有無に関係なく常に iframe で動作する。
      エディタスクリプトから グローバルの document / window でキャンバス内の要素を探したり、イベントを登録したりするコードは別ドキュメントを見ることになり動かなくなる。
      要素の ownerDocument / defaultView 経由でキャンバスのドキュメントを取得し、リスナーは useRefEffect で付け外しすること。エディタ向け CSS もキャンバス内に読み込まれるか（editorStyle / block.json の style）を確認すること。
    status: shipped
    severity: high
    confidence: manual
    match_hint: '\b(?:document|window)\.(?:querySelector(?:All)?|getElementById|getElementsBy\w+|addEventListener)\s*\('
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/03/iframed-editor-changes-in-wordpress-7-1/'
      - 'https://make.wordpress.org/core/2026/08/05/wordpress-7-1-field-guide/'
  -
    id: 'editor_js:block-editor-document-isolation-policy'
    type: editor_js
    title: 'ブロックエディタ画面に Document-Isolation-Policy（cross-origin isolation）が付与される'
    summary: |
      クライアントサイドメディア処理が有効な場合、Chromium 137+ ではブロックエディタ・サイトエディタ・ウィジェット画面に Document-Isolation-Policy: isolate-and-credentialless が送られる。
      外部オリジンのスクリプトには crossorigin="anonymous" が自動付与され、ブラウザからの cross-origin fetch は credentialless 扱いとなり CORS で失敗しやすくなる。外部画像の取り込みはサーバー側（メディアエンドポイントの url パラメータ）で行うこと。
      独自の Content-Security-Policy を送るプラグインは worker-src に blob: を含めないと WASM ワーカーが起動せずサーバー処理へフォールバックする。エディタ内で外部リソースや埋め込みを読み込むプラグインは要確認。無効化は wp_client_side_media_processing_enabled フィルターで false を返す。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
      -
        kind: hook
        name: wp_client_side_media_processing_enabled
    match_hint: Content-Security-Policy|worker-src
    source_urls:
      - 'https://make.wordpress.org/core/2026/07/22/client-side-media-processing-in-wordpress-7-1/'
  -
    id: 'css:navigation-font-size-no-propagation'
    type: css
    title: ナビゲーションブロックが子項目へフォントサイズのクラス・スタイルを付与しなくなった
    summary: |
      Navigation ブロックのフォントサイズ設定は core/navigation-link, core/navigation-submenu, core/page-list, core/home-link の各要素へ has-{slug}-font-size クラスやインライン font-size として伝播しなくなり、通常の CSS 継承に任せるようになった。
      ナビゲーション項目の has-*-font-size を直接狙っているテーマ CSS は効かなくなる。必要なら dev note にある render_block_{block} フィルターで旧挙動を復元できる。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
      -
        kind: block
        name: core/navigation-link
      -
        kind: block
        name: core/navigation-submenu
      -
        kind: block
        name: core/page-list
      -
        kind: block
        name: core/home-link
    related:
      - 'removed:function:block_core_home_link_build_css_font_sizes'
      - 'removed:function:block_core_navigation_submenu_build_css_font_sizes'
      - 'removed:function:block_core_page_list_build_css_font_sizes'
      - 'deprecated:function:block_core_navigation_link_build_css_font_sizes'
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/04/miscellaneous-block-editor-changes-in-wordpress-7-1/'
  -
    id: 'deprecated:blocks-experimental-clone-sanitize'
    type: deprecated
    title: '@wordpress/blocks の __experimentalCloneSanitizedBlock / __experimentalSanitizeBlockAttributes が非推奨になった'
    summary: |
      安定版の cloneSanitizedBlock / sanitizeBlockAttributes が追加され、__experimental 版は動作するもののコンソールに非推奨警告を出す。
      wp.blocks または @wordpress/blocks から呼んでいる箇所を安定版に置き換えること。
    status: shipped
    severity: low
    confidence: medium
    match_hint: '__experimental(?:CloneSanitizedBlock|SanitizeBlockAttributes)\b'
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/04/miscellaneous-block-editor-changes-in-wordpress-7-1/'
  -
    id: 'editor_js:paste-handler-markdown-parser-marked'
    type: editor_js
    title: '貼り付け時の Markdown パーサーが showdown から marked に変わった'
    summary: |
      @wordpress/blocks の pasteHandler() 内部で使う Markdown 変換が showdown から marked（CommonMark / GFM 準拠）に置き換わった。
      API の変更はないが、エッジケースの変換結果が変わり得る。pasteHandler() を直接呼んでいるコードは代表的な Markdown 入力で生成ブロックを再確認すること。
    status: shipped
    severity: low
    confidence: manual
    match_hint: '\bpasteHandler\s*\('
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/04/miscellaneous-block-editor-changes-in-wordpress-7-1/'
  -
    id: 'editor_js:core-data-non-paginated-entities-return-all'
    type: editor_js
    title: 'getEntityRecords() が非ページネーションのエンティティで全件を返すようになった'
    summary: |
      これまで getEntityRecords() は全エンティティに対してクライアント側で per_page=10 相当の切り詰めを行っていた（バグ）。7.1 では supportsPagination: true を宣言したエンティティだけが切り詰められ、それ以外は全件を返す。
      10 件しか返らない前提で描画・ループしているコードは件数増加に注意。独自エンティティが非ページネーションの REST ルートに基づく場合は supportsPagination: false を宣言すること。per_page: -1 の回避策は不要だが害はない。
    status: shipped
    severity: medium
    confidence: medium
    match_hint: '\bgetEntityRecords\s*\(|supportsPagination'
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/04/miscellaneous-block-editor-changes-in-wordpress-7-1/'
  -
    id: 'css:block-level-preset-class-specificity'
    type: css
    title: ブロックレベルのプリセットクラスの詳細度がルートレベルと同じに下がった
    summary: |
      theme.json の settings.blocks.<block> や wp_theme_json_data_* フィルターで定義したブロックレベルプリセットのユーティリティクラス（.has-*-color, -background-color, -font-size など）は、ブロックセレクタが :where() で包まれ詳細度 0-1-0 になった。
      トップレベルとブロックレベルのプリセットの間に割り込む !important 付きの独自 CSS を書いているテーマ・プラグインは優先順位が変わる可能性がある。
    status: shipped
    severity: low
    confidence: manual
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/04/miscellaneous-block-editor-changes-in-wordpress-7-1/'
  -
    id: 'editor_js:wordpress-nux-noop'
    type: editor_js
    title: '@wordpress/nux が何もしない互換パッケージになった'
    summary: |
      5.4 から非推奨だった @wordpress/nux（wp-nux）は 7.1 で no-op になった。import やスクリプト依存は壊れないが、ヒントやガイドは一切表示されない。
      オンボーディングに NUX を使っている場合は @wordpress/components の Guide コンポーネントへ移行すること。
    status: shipped
    severity: medium
    confidence: high
    symbols:
      -
        kind: js_package
        name: '@wordpress/nux'
        replacement: '@wordpress/components (Guide)'
      -
        kind: js_handle
        name: wp-nux
    source_urls:
      - 'https://make.wordpress.org/core/2026/08/04/miscellaneous-block-editor-changes-in-wordpress-7-1/'
  -
    id: 'deprecated:wordpress-reusable-blocks-package'
    type: deprecated
    title: '@wordpress/reusable-blocks の公開 API が非推奨警告を出すようになった'
    summary: |
      @wordpress/reusable-blocks（wp-reusable-blocks）のコンポーネントとデータ API が呼び出し時に非推奨警告を出す。将来は @wordpress/nux と同様に no-op 化される予定。
      同期パターン（旧再利用ブロック）の取得・更新は core-data の標準エンティティメソッドへ移行すること。
    status: shipped
    severity: low
    confidence: high
    symbols:
