  -
    id: 'editor_js:components-40px-default-size-enforced'
    type: editor_js
    title: '@wordpress/components のフォームコントロールが無条件で 40px 高になった'
    summary: |
      TextControl, SelectControl, InputControl, RangeControl, ComboboxControl, FontSizePicker など多数のフォームコントロールは 40px 高が既定となり、__next40pxDefaultSize は実行時に無視される。__next40pxDefaultSize={ false } で 36px に戻すこともできない。
      BorderBoxControl, BorderControl, FontSizePicker, ToggleGroupControl の size プロップも無効。高さ 36px 前提のレイアウトや CSS を持つ設定画面・インスペクターは表示崩れを確認し、不要になったプロップを削除すること。Button は対象外。
    status: shipped
    severity: low
    confidence: medium
    match_hint: '__next40pxDefaultSize|size=[''"]__unstable-large[''"]'
    source_urls:
      - 'https://make.wordpress.org/core/2026/07/23/editor-components-updates-in-wordpress-7-1/'
  -
    id: 'editor_js:components-emotion-css-prop-noop'
    type: editor_js
    title: '@wordpress/components の View の css プロップが無効化され、Emotion から SCSS への移行が始まった'
    summary: |
      View は型互換のため css プロップを受け付けるが no-op になった。Divider, Surface, Truncate, View, Flex, Spacer は Emotion を経由しなくなったため、cx() に複数の css() 断片を渡している場合はオーバーライド順が変わり得る。
      View の css プロップは style または className に置き換え、順序依存の断片は 1 つの css() 呼び出しにまとめてから cx() に渡すこと。対象コンポーネントは今後増える予定。
    status: shipped
    severity: medium
    confidence: manual
    match_hint: '\bcx\s*\(|\bcss=\{'
    source_urls:
