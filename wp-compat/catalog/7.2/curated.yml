  -
    id: 'behavior:wp-kses-html-api-parser'
    type: behavior
    title: 'wp_kses() が HTML API ベースの新実装に置き換わった（旧実装はフィルターで復帰可能）'
    summary: |
      trunk では wp_kses() が HTML API（Tag Processor）ベースの実装に置き換わり、既定で有効になっている。出力は再シリアライズされるため、タグの小文字化・属性の二重引用符化・文字参照の正規化が起き、許可されていない script/style は中身ごと削除、途中で切れた末尾のタグ断片は破棄、複雑な SVG/MathML はそこで打ち切りになる。
      wp_kses 系の出力を文字列比較しているテストや、セミコロンなしの & を含むテキストを通しているコードは結果が変わる可能性がある。`wp_kses_force_legacy_parser` フィルターで true を返すと旧実装に戻せるが、旧実装は 7.2.0 で消える可能性もあるため、ベータ期間中に新実装で検証すること。
