    id: 'behavior:absint-int-return-type'
    type: behavior
    title: 'absint() に int 戻り値型が付き、範囲外の float は PHP_INT_MAX に丸められる'
    summary: |
      `absint()` のシグネチャが `absint( $maybeint ): int` になり、整数範囲を超える有限の float はオーバーフローではなく `PHP_INT_MAX` を返すようになった。NAN/INF は従来どおり 0。
      通常の利用では影響しないが、巨大な数値やオーバーフロー後の値に依存したテスト・ID 計算があれば確認すること。
