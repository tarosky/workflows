  -
    id: 'behavior:wp-mail-embeds-parameter'
    type: behavior
    title: 'wp_mail() に第6引数 $embeds が追加された（pluggable で上書きしている場合は追従が必要）'
    summary: |
      wp_mail( $to, $subject, $message, $headers, $attachments, $embeds ) となり、cid: 参照のインライン画像を添付できる。
      各画像は wp_mail_embed_args フィルターで調整できる。wp_mail() を pluggable で丸ごと置き換えているプラグインは
      $embeds 引数と wp_mail_embed_args を扱わないと、この機能を使う他プラグインのメールで画像が欠落する。
    status: shipped
    severity: low
    confidence: medium
    symbols:
      -
        kind: function
        name: wp_mail
      -
        kind: hook
        name: wp_mail_embed_args
    match_hint: 'function\s+wp_mail\s*\('
    source_urls:
