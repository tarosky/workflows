changes:
  -
    id: 'behavior:adjacent-post-where-id-tiebreaker'
    type: behavior
    title: 'get_adjacent_post() の WHERE 句に ID のタイブレークが追加され、WHERE を書き換えるフィルターが無限ループし得る'
    summary: |
      同一 post_date の投稿で前後ナビゲーションが壊れるバグ修正として、get_adjacent_post() の WHERE 句が
      「日付 > X OR (日付 = X AND p.ID > N)」の形になり、ORDER BY にも p.ID が追加された。
      get_{$adjacent}_post_where フィルターで投稿日付を str_replace して「隣」の投稿を差し替えている
      プラグイン・テーマ（Storefront 系など）は ID 比較が残るため同じ投稿を返し続け、無限ループになる。
      日付に加えて `AND p.ID <|> {ID}` 部分も置換するよう修正すること。
    status: shipped
    severity: high
    confidence: medium
    symbols:
      -
        kind: hook
        name: 'get_{$adjacent}_post_where'
      -
        kind: hook
        name: get_next_post_where
      -
        kind: hook
        name: get_previous_post_where
      -
        kind: function
        name: get_adjacent_post
    match_hint: 'get_(next|previous|\{\$adjacent\})_post_where'
    source_urls:
      - 'https://make.wordpress.org/core/2025/12/10/adjacent-post-navigation-changes-in-wordpress-6-9-and-compatibility-issues/'
      - 'https://make.wordpress.org/core/2025/12/12/wordpress-6-9-hotfixes/'
  -
    id: 'behavior:classic-theme-block-styles-on-demand'
    type: behavior
    title: 'クラシックテーマでもブロックスタイルがオンデマンド読み込みになり、wp-block-library 一括CSSが出なくなった'
    summary: |
      6.9 ではクラシックテーマも既定で should_load_separate_core_block_assets が有効になり（wp_load_classic_theme_block_styles_on_demand()）、
      テンプレート出力をバッファしてブロックごとのCSSを <head> へ持ち上げる。巨大な wp-block-library を前提にしていたテーマで
      スタイル欠落やカスケード順の変化が報告されている（#64354、6.9 ホットフィックス記事）。do_blocks() を通さない独自出力のブロックは
      CSS が読み込まれないので wp_enqueue_style( 'wp-block-video' ) 等で明示的に読み込むこと。また wp-block-library を登録解除し
      global-styles を wp_enqueue_scripts で dequeue してブロックCSSを全廃していたコードは効かなくなる（global-styles は wp_footer で読み込まれる）。
      回避策は init より前に should_load_separate_core_block_assets を false にすること。出力バッファにより TTFB も増える。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
      -
        kind: hook
        name: should_load_separate_core_block_assets
      -
        kind: function
        name: wp_load_classic_theme_block_styles_on_demand
      -
        kind: css_handle
        name: wp-block-library
      -
        kind: css_handle
        name: global-styles
    match_hint: 'wp_(deregister|dequeue)_style\s*\(\s*[''"](wp-block-library|global-styles)[''"]'
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
      - 'https://make.wordpress.org/core/2025/12/12/wordpress-6-9-hotfixes/'
  -
    id: 'behavior:template-enhancement-output-buffer'
    type: behavior
    title: 'テンプレート全体の出力バッファ（template enhancement output buffer）が導入された'
    summary: |
      template_include 適用後に wp_before_include_template アクションが発火し、そこで出力バッファが開始される
      （wp_template_enhancement_output_buffer フィルター等にコールバックがある場合や、クラシックテーマのオンデマンドCSSで使用）。
      独自に ob_start() でページ全体をバッファしていたキャッシュ・最適化プラグインは二重バッファになるため動作確認すること。
      このフィルター／wp_finalized_template_enhancement_output_buffer アクション内で ob_start() を呼ぶと Fatal、アクション内での echo は出力されない。
      バッファは wp_should_output_buffer_template_for_enhancement フィルターで強制的に無効化できる。
    status: shipped
    severity: low
    confidence: manual
    symbols:
      -
        kind: hook
        name: wp_before_include_template
      -
        kind: hook
        name: wp_template_enhancement_output_buffer
      -
        kind: hook
        name: wp_finalized_template_enhancement_output_buffer
      -
        kind: hook
        name: wp_template_enhancement_output_buffer_started
      -
        kind: hook
        name: wp_should_output_buffer_template_for_enhancement
    related:
      - 'behavior:classic-theme-block-styles-on-demand'
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
  -
    id: 'behavior:hidden-block-assets-dequeued'
    type: behavior
    title: '出力が空になったブロックが enqueue したスクリプト・スタイルは自動で dequeue される'
    summary: |
      6.9 ではブロックをレンダリングした結果マークアップが出力されなかった場合（非表示ブロック、アイキャッチ未設定の Featured Image など）、
      そのブロックがレンダリング中に enqueue したスクリプト・スタイルが dequeue される。入れ子のブロックにも及ぶ。
      空出力のブロックの資産に他のコードが依存している場合は enqueue_empty_block_content_assets フィルター（第2引数にブロック名）で true を返すこと。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
      -
        kind: hook
        name: enqueue_empty_block_content_assets
    related:
      - 'editor_js:block-visibility-support'
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
      - 'https://make.wordpress.org/core/2025/12/01/ability-to-hide-blocks/'
  -
    id: 'behavior:ie-conditional-assets-ignored'
    type: behavior
    title: 'IE 条件付きコメント（conditional）で登録したスクリプト・スタイルは出力されなくなった'
    summary: |
      wp_script_add_data() / wp_style_add_data() の 'conditional' は廃止され、WP_DEBUG 時に非推奨 Notice が出る。
      conditional 指定されたアセットは出力されず、他から必要とされていないその依存アセットも出力されない。
      conditional を指定していたコードは削除するか、条件なしで読み込むよう修正すること。
    status: shipped
    severity: medium
    confidence: medium
    symbols:
      -
        kind: function
        name: wp_script_add_data
      -
        kind: function
        name: wp_style_add_data
    match_hint: '_add_data\s*\([^)]*[''"]conditional[''"]'
    related:
      - 'argument_deprecated:method:WP_Dependencies::add_data'
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/19/legacy-internet-explorer-code-removed/'
  -
    id: 'behavior:inline-style-limit-and-oembed-links-order'
    type: behavior
    title: 'インライン化されるCSSの上限が20KBから40KBに増え、oEmbed discovery リンクの出力位置が前に移った'
    summary: |
      path データ付きスタイルをインライン化する既定上限（styles_inline_size_limit）が 40KB になり、外部CSSファイルだった
      スタイルが <style> として出力される場面が増える。CSS の外部ファイル化を前提にしたキャッシュ・最適化系プラグインは確認すること。
      また wp_oembed_add_discovery_links() はスクリプト・スタイルより前（wp_head 優先度4）に出力されるようになった。
      oEmbed リンクを消すには remove_action ではなく oembed_discovery_links フィルターの使用が推奨される。
    status: shipped
    severity: low
    confidence: manual
    symbols:
      -
        kind: hook
        name: styles_inline_size_limit
      -
        kind: function
        name: wp_oembed_add_discovery_links
      -
        kind: hook
        name: oembed_discovery_links
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
  -
    id: 'behavior:script-module-fetchpriority-and-footer'
    type: behavior
    title: 'インタラクティブブロックのスクリプトモジュールと comment-reply が既定で fetchpriority=low になった'
    summary: |
      Interactivity API を使うブロック（コア外のカスタムブロック含む）の viewScriptModule と comment-reply スクリプトは既定で
      fetchpriority="low" が付与され、依存モジュールや modulepreload にも伝播する。スクリプト／スクリプトモジュールの $args に
      fetchpriority、スクリプトモジュールに in_footer が追加された。読み込み順・優先度に依存するコードは確認すること。
    status: shipped
    severity: low
    confidence: manual
    symbols:
      -
        kind: function
        name: wp_register_script_module
      -
        kind: function
        name: wp_enqueue_script_module
      -
        kind: method
        name: 'WP_Script_Modules::set_fetchpriority'
      -
        kind: js_handle
        name: comment-reply
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
  -
    id: 'behavior:wp-cron-spawn-at-shutdown'
    type: behavior
    title: 'WP Cron の起動が init から shutdown に移った'
    summary: |
      TTFB 改善のため _wp_cron() は shutdown アクションで実行されるようになった。cron の起動タイミングや、
      リクエスト前半で cron が走ることを前提にしたコードは確認すること。ALTERNATE_WP_CRON 環境で壊れる問題は RC4 で修正済み（#64315）。
    status: shipped
    severity: low
    confidence: manual
    symbols:
      -
        kind: function
        name: _wp_cron
      -
        kind: function
        name: wp_cron
      -
        kind: constant
        name: ALTERNATE_WP_CRON
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
      - 'https://make.wordpress.org/core/2025/12/01/wordpress-6-9-release-candidate-4/'
  -
    id: 'behavior:fetch-feed-site-transients'
    type: behavior
    title: 'fetch_feed() のキャッシュがサイトトランジェントに保存されるようになった'
    summary: |
      fetch_feed() は (get|set)_transient() ではなく (get|set)_site_transient() でフィードをキャッシュする。マルチサイトでは
      全サイトでキャッシュが共有される。また 6.7 以降壊れていたフィードキャッシュ（SimplePie 更新起因）が修正された。
      フィードのトランジェントを直接読み書き・削除しているコードは保存先の変更に注意すること。
    status: shipped
    severity: low
    confidence: medium
    symbols:
      -
        kind: function
        name: fetch_feed
      -
        kind: class
        name: WP_Feed_Cache_Transient
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/17/miscellaneous-developer-focused-changes-in-6-9/'
      - 'https://make.wordpress.org/core/2025/11/18/wordpress-6-9-frontend-performance-field-guide/'
  -
    id: 'behavior:query-cache-salted-keys'
    type: behavior
    title: 'クエリキャッシュのキー生成が変わり、last_changed をキーに含めなくなった'
    summary: |
      WP_Query・コメント・ターム・ユーザー・サイト・ネットワーク等のクエリキャッシュは、last_changed をキーの一部にせず
      値と一緒に保存して比較する方式（wp_cache_get_salted() など4関数）に変わった。post-queries / comment-queries 等のグループで
      wp_query・get_comments・adjacent_post・get_page_by_path などで始まるキーを直接読み書きしていたコードはキーが一致しなくなる。
      function_exists( 'wp_cache_get_salted' ) で分岐して新関数を使うこと。永続オブジェクトキャッシュのドロップインは変更不要。
    status: shipped
    severity: medium
    confidence: medium
    symbols:
      -
        kind: function
        name: wp_cache_get_salted
      -
        kind: function
        name: wp_cache_set_salted
      -
        kind: function
        name: wp_cache_get_multiple_salted
      -
        kind: function
        name: wp_cache_set_multiple_salted
    match_hint: 'wp_cache_(get|set|delete|add)\s*\([^;]*[''"](post|comment|term|user|site|network)-queries[''"]'
    source_urls:
      - 'https://make.wordpress.org/core/2025/11/17/consistent-cache-keys-for-query-groups-in-wordpress-6-9/'
  -
    id: 'behavior:wp-mail-sender-address'
    type: behavior
    title: 'wp_mail() が送信者アドレス（Envelope-From）を設定するようになり、一部環境でメールが送れなくなった'
    summary: |
      wp_mail() は From ヘッダー（なければ wordpress@ドメイン）を Envelope-From/Sender として設定するようになった。
      エンコーディングの呼び出し間リセットや multipart の Content-Type 修正も入っている。phpmailer_init で Sender を
      設定していた回避策は不要になる場合がある一方、一部のメール構成では 6.9 で送信できなくなる不具合が報告されている（#64368、Hotfix プラグインで回避）。
      独自の SMTP/メール設定を持つプラグインは送信テストを行い、必要なら wp_mail_from フィルターで調整すること。
    status: shipped
    severity: medium
    confidence: manual
    symbols:
